<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TipJar</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, Arial, sans-serif; background: #0b1020; color: #edf3ff; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top, #26345d, #0b1020 55%); }
      main { width: min(100%, 720px); padding: 36px; border: 1px solid #ffffff20; border-radius: 24px; background: #121a2dee; box-shadow: 0 24px 70px #0007; }
      .brand { color: #a9b8d9; font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 28px 0 12px; font-size: clamp(2.6rem, 8vw, 4.5rem); line-height: .98; letter-spacing: -.06em; }
      p { max-width: 55ch; color: #a9b8d9; font-size: 1.1rem; line-height: 1.7; }
      .button { display: inline-block; margin-top: 16px; padding: 14px 20px; border-radius: 12px; background: #7c9cff; color: white; font-weight: 700; text-decoration: none; }
      .note { margin-top: 32px; padding-top: 20px; border-top: 1px solid #ffffff20; color: #a9b8d9; font-size: .9rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">TipJar</div>
      <h1>Support the work.</h1>
      <p>A simple place to collect appreciation, tips, and support. Add your wallet or payment link so people can send a little love.</p>
      <a class="button" href="mailto:hello@example.com?subject=Tip%20Jar">Send a Tip</a>
      <div class="note">Built for easy sharing on Farcaster and other social platforms.</div>
    </main>
  </body>
</html>
