<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tip Jar</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#0b0b0f;color:#eee;display:flex;justify-content:center}
  main{width:100%;max-width:560px;padding:32px 20px}
  h1{font-size:28px;margin:0 0 4px}
  .sub{color:#888;margin:0 0 24px}
  input,button{font:inherit;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #2a2a35;background:#15151d;color:#eee;padding:12px}
  input{margin-bottom:10px}
  #go{background:#4c6ef5;border:0;font-weight:600;padding:14px}
  .row{display:flex;gap:8px;margin-bottom:10px}
  .row button{flex:1;background:#1d1d27;border:1px solid #2a2a35}
  .wall{margin-top:28px;border-top:1px solid #1d1d27;padding-top:16px}
  .item{padding:10px 0;border-bottom:1px solid #15151d;font-size:14px}
  .item b{color:#8fa4ff}
  .item span{color:#777;font-size:12px;display:block}
  #status{font-size:13px;color:#888;margin-top:12px;min-height:18px}
</style>
<main>
  <h1>Tip Jar</h1>
  <p class="sub">Leave a tip and a message. It shows up on the wall.</p>
  <div class="row">
    <button data-v="0.0001">0.0001</button>
    <button data-v="0.0005">0.0005</button>
    <button data-v="0.001">0.001</button>
  </div>
  <input id="amt" value="0.0001" inputmode="decimal">
  <input id="msg" maxlength="140" placeholder="Message (optional)">
  <button id="go">Connect &amp; Tip</button>
  <div id="status"></div>
  <div class="wall"><h3 style="font-size:15px;margin:0 0 8px">Recent tips</h3><div id="list"></div></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script>
const CONTRACT = "0x6D886Ccb59074b0F6bCD9A7e1b9f3c842Ce50E91";
const RPC = "https://mainnet.base.org";
const ABI = ["function donate(string m) payable",
             "event Donation(address indexed from, uint256 amount, string message)"];
const say = t => document.getElementById("status").textContent = t;
document.querySelectorAll(".row button").forEach(b => b.onclick = () => document.getElementById("amt").value = b.dataset.v);
const esc = s => s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

async function wall() {
  try {
    const p = new ethers.JsonRpcProvider(RPC, 8453, { staticNetwork: true });
    const c = new ethers.Contract(CONTRACT, ABI, p);
    const head = await p.getBlockNumber();
    const logs = await c.queryFilter(c.filters.Donation(), Math.max(0, head - 5000), head);
    const list = document.getElementById("list");
    if (!logs.length) { list.innerHTML = '<div class="item">No tips yet. Be first.</div>'; return; }
    list.innerHTML = logs.slice(-25).reverse().map(l =>
      `<div class="item"><b>${l.args.from.slice(0,6)}…${l.args.from.slice(-4)}</b> tipped ${ethers.formatEther(l.args.amount)} ETH
       <span>${l.args.message ? esc(l.args.message) : "—"}</span></div>`).join("");
  } catch (e) { console.error(e); }
}

document.getElementById("go").onclick = async () => {
  try {
    if (!window.ethereum) return say("No wallet here. Open this inside a wallet app.");
    const p = new ethers.BrowserProvider(window.ethereum);
    await p.send("wallet_switchEthereumChain", [{ chainId: "0x2105" }]).catch(() =>
      p.send("wallet_addEthereumChain", [{ chainId: "0x2105", chainName: "Base",
        nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
        rpcUrls: [RPC], blockExplorerUrls: ["https://basescan.org"] }]));
    const c = new ethers.Contract(CONTRACT, ABI, await p.getSigner());
    const value = ethers.parseEther(document.getElementById("amt").value || "0");
    say("Confirm in your wallet…");
    const tx = await c.donate(document.getElementById("msg").value || "", { value });
    say("Sending…");
    await tx.wait();
    say("Thanks. It landed.");
    document.getElementById("msg").value = "";
    wall();
  } catch (e) { say(e.shortMessage || e.message); }
};
wall(); setInterval(wall, 30000);
</script>
